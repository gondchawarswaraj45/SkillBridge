# ========================================================
# SkillBridge Development Profile Configuration
# ========================================================

# If MySQL credentials are provided via environment variables, use them;
# otherwise gracefully fallback to persistent in-memory H2 for development.
spring.datasource.url=${DB_URL:jdbc:h2:mem:skillbridge_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=true

# H2 Console (available at /h2-console during dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration Defaults for Local Development
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

